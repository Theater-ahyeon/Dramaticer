# Dramaticer 渠道配置
# 复制成 data/channels.yaml 后使用；字符串里的 ${VAR} 从 .env 读取。
# 一个模型可以按优先级配置多个渠道，前面的渠道失败后自动切换。

channels:
  bg:
    api: openai-completions
    baseUrl: ${DRAMATICER_BG_BASE_URL}
    apiKey: ${DRAMATICER_BG_API_KEY}
    requestsPerMinute: 20
    maxRetries: 2
    retryBaseDelayMs: 1000
    timeoutMs: 300000
  # 后台保底：建议是另一家供应商。主后台渠道额度耗尽（402）、被停用（403）或
  # 持续 5xx 时，后台岗位改用 bg-fallback（见 models.background.fallback）。
  bg2:
    api: openai-completions
    baseUrl: ${DRAMATICER_BG2_BASE_URL}
    apiKey: ${DRAMATICER_BG2_API_KEY}
    requestsPerMinute: 20
    maxRetries: 2
    retryBaseDelayMs: 1000
    timeoutMs: 300000
  main:
    api: openai-completions
    baseUrl: ${DRAMATICER_MAIN_BASE_URL}
    apiKey: ${DRAMATICER_MAIN_API_KEY}
    requestsPerMinute: 30
    maxRetries: 2
    retryBaseDelayMs: 1000
    timeoutMs: 300000
  # Vertex AI：凭证、项目与区域从 .env 读取（GOOGLE_APPLICATION_CREDENTIALS、
  # GOOGLE_CLOUD_PROJECT、GOOGLE_CLOUD_LOCATION）。apiKey 留空表示用服务账号；
  # baseUrl 里的 {location} 由 pi-ai 的 Vertex 适配器交给 Google SDK 解析。
  vertex:
    api: google-vertex
    baseUrl: https://{location}-aiplatform.googleapis.com
    apiKey: ""
    requestsPerMinute: 20
    maxRetries: 2
    retryBaseDelayMs: 1000
    timeoutMs: 300000

models:
  background:
    id: ${DRAMATICER_BG_MODEL}
    contextWindow: 131072
    # 后台模型承担结算、事件抽取与合并调用，这些请求不单独声明输出上限。
    # 带思考的模型每次请求的思考就占几千 token，输出上限必须同时容纳思考与
    # JSON：四楼结算窗口实测需要约 2.4 万 token（含思考），8,192 会把 JSON
    # 截断成无法解析的段落（ADR-0057）。
    maxTokens: 32768
    reasoning: true
    channels: [bg]
    # 主模型所有渠道都失败后，后台岗位（结算、规划）改用这个模型；正文写作不会
    # 自动换模型。保底和它共用渠道时启动日志与设置页会提醒。
    fallback: bg-fallback
  main:
    id: ${DRAMATICER_MAIN_MODEL}
    contextWindow: 131072
    maxTokens: 8192
    reasoning: true
    channels: [main]
    # 停用后不能选为故事模型或角色目标，也不参与路由；不写时默认启用。
    # enabled: false
    # 工具调用传输：native 用原生函数调用，text 让模型把调用写在正文里
    # （<tool name="…">{json}</tool>，程序解析执行）。不写时按 probe.functionCalling
    # 决定：体检报告不支持函数调用就用 text，其余用 native。
    # tools:
    #   transport: text

  # ADR-0042 的回退别名：主线路由不可用时切到这些模型。
  main-fallback:
    id: auto/deepseek-v4.1-flash
    contextWindow: 131072
    maxTokens: 8192
    reasoning: true
    channels: [main]
    tools:
      transport: native
  bg-fallback:
    id: ${DRAMATICER_BG2_MODEL}
    contextWindow: 131072
    maxTokens: 32768
    reasoning: true
    # 走另一家供应商的渠道；写 [bg] 会和主后台模型一起停。
    channels: [bg2]
  codex:
    id: codex/gpt-6.1-terra
    contextWindow: 500000
    maxTokens: 16384
    reasoning: true
    channels: [main]
  # Vertex 上的 Gemini；凭证就绪后可以把 roles.writer 指向这个别名。
  gemini-4-argon:
    id: gemini-4-argon
    contextWindow: 131072
    maxTokens: 8192
    reasoning: true
    channels: [vertex]
    tools:
      transport: native

# 按岗位配置模型。没有写出的角色回落到 main（writer）或 background（其余）。
# 裁判（judge）必须与写作（writer）来自不同模型家族，按模型名判断，
# 相同会导致启动直接失败；background 与 main 是同一家族时请另配一个模型并指向它。
roles:
  writer: main
  settler: background
  planner: background
  judge: background

embeddings:
  default:
    api: openai-embeddings
    baseUrl: https://api.siliconflow.cn/v1
    apiKey: ${SILICONFLOW_API_KEY}
    model: BAAI/bge-m3
    dimensions: 1024
    batchSize: 32
    requestsPerMinute: 20

# 重排序：多路融合后把前 20 条候选交给重排序模型再排序。默认关闭；
# 事件题与状态题评测确认有提升后再把 enabled 改成 true（R1-T03.b、R1-T04.b）。
reranker:
  enabled: false
  api: openai-rerank
  baseUrl: https://api.siliconflow.cn/v1
  apiKey: ${SILICONFLOW_API_KEY}
  model: BAAI/bge-reranker-v2-m3
  batchSize: 32
  requestsPerMinute: 20
  maxRetries: 2
  retryBaseDelayMs: 1000
  timeoutMs: 30000
  # 单条文档最多发送的码点数；bge-reranker-v2-m3 的输入上限是 8192 token
  maxDocumentChars: 4000
