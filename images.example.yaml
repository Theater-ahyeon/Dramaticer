# 生图后端配置。复制为 data/images.yaml 后启用生图；文件不存在时生图功能关闭。
# apiKey 只写空字符串或 ${环境变量名} 引用，密钥值不要写进文件。
providers:
  comfyui:
    api: comfyui
    baseUrl: http://127.0.0.1:8188
    apiKey: ""
    timeoutMs: 300000
    pollIntervalMs: 1000
  # NovelAI：apiKey 填持久令牌（网页端 账户设置 → 获取持久 API 令牌，pst- 开头），
  # 写进 .env 的 NOVELAI_API_KEY。baseUrl 不写时用官方地址，也可以填兼容的中转地址。
  # 配好后在「生图」页新建 NovelAI 模板，再在故事设置里选这个模板。
  # 环境变量没设置时整个文件会读取失败，所以默认注释掉，需要时去掉行首的 #。
  # novelai:
  #   api: novelai
  #   apiKey: ${NOVELAI_API_KEY}
  #   timeoutMs: 120000
